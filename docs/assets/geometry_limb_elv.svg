<text x="454.16" y="265.00" text-anchor="start" class="small">지표면 접점 T</text>
<path d="M300.00,40.00 A50,50 0 0 1 344.07,113.62" fill="none" stroke="#226ca3" stroke-width="2.5"/>
<text x="351.00" y="58.00" text-anchor="middle" class="blue bold">θ</text>
