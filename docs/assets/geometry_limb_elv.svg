<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">위성 고도, 천정각과 Earth limb elevation</title><desc id="desc">위성에서 지표면 접점으로 향하는 시선이 ELV 0도다. 그보다 위를 향하는 관측 시선은 양의 ELV를 가지며, 천정 방향에서 잰 각도는 천정각 세타다. 최소 ELV를 높이면 접선 부근의 관측 방향을 더 제외한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="context-stroke"/></marker><radialGradient id="earth"><stop stop-color="#e2edf8"/><stop offset="1" stop-color="#bdd1e6"/></radialGradient></defs><style>text{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:20px;fill:#203348}.small{font-size:17px}.bold{font-weight:700}.halo{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.blue{fill:#226ca3}.green{fill:#008060}.orange{fill:#c36a09}</style>
<circle cx="300" cy="360" r="205" fill="#f3f9f9" stroke="#8bb8be" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="300" cy="360" r="180" fill="url(#earth)" stroke="#567da3" stroke-width="2.5"/>
<text x="300.00" y="383.00" text-anchor="middle" class="bold">지구</text>
<text x="300.00" y="410.00" text-anchor="middle" class="small">중심 O</text>
<text x="70.00" y="146.00" text-anchor="start" class="small">대기층</text>
