<text x="705.00" y="270.00" text-anchor="start" class="green small">ELV ≥ 최소 ELV → 표시</text>
<text x="970.00" y="450.00" text-anchor="end" class="green bold">최소 ELV 경계</text>
<text x="980.00" y="588.00" text-anchor="end" class="small">지표면 limb 방향 · ELV = 0°</text>
<circle cx="300" cy="90" r="7" fill="#244c78" stroke="white" stroke-width="2"/>
<text x="370.00" y="80.00" text-anchor="start" class="bold">위성 S</text>
<text x="500.00" y="632.00" text-anchor="middle" class="bold">ELV = 180° − asin[R / (R + H)] − θ</text>
<text x="500.00" y="663.00" text-anchor="middle" class="small">θ: 천정에서 잰 시선각 · H: 지표면 위 위성 고도 · 거리와 각도는 개념도</text>
</svg>