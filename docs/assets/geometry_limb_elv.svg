<text x="245.00" y="143.00" text-anchor="end" class="bold">H</text>
<path d="M300.00,360.00 L120.00,360.00" fill="none" stroke="#567da3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="203.00" y="347.00" text-anchor="middle" class="bold">R</text>
<path d="M300.00,90.00 L733.33,574.48" fill="none" stroke="#738292" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
